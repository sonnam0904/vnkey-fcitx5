name: CI

on:
  push:
  pull_request:
  # Release gates its packaging and publish jobs on this same workflow so a
  # broken conversion can never be shipped.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The root CMakeLists builds only the core library and the test binary,
      # so this needs nothing beyond the compiler and cmake already on the
      # runner — no fcitx5 or libcurl headers.
      - name: Build core library and tests
        run: |
          cmake -B build .
          cmake --build build -j"$(nproc)"

      - name: Run C++ tests
        run: ./build/telebit_telex_tests

  # Separate job because this one needs the fcitx5 and libcurl headers: the
  # doctor CLI itself links neither, but it lives in the telebit-fcitx5 project
  # and configuring that project also configures the addon target.
  #
  # It runs here rather than only in install.sh so a broken verdict layer cannot
  # reach a release — release.yml gates its packaging jobs on this workflow, and
  # a called workflow only succeeds when every one of its jobs does.
  test-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libgtk-4-dev builds telebit-setup; desktop-file-utils and appstream
      # only validate its metadata. That validation lives here, in the one job
      # that already configures telebit-fcitx5/ (the metainfo is generated by
      # CMake), and deliberately not in the packaging jobs: jammy ships
      # appstreamcli 0.15 and trixie 1.0, and they disagree about strictness,
      # so gating a release build on it would fail suites at random.
      - name: Install fcitx5, libcurl, GTK4 headers and metadata validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            extra-cmake-modules \
            libfcitx5core-dev \
            libfcitx5utils-dev \
            libcurl4-openssl-dev \
            libgtk-4-dev \
            desktop-file-utils \
            appstream

      - name: Build addon and doctor CLI
        run: |
          cmake -B telebit-fcitx5/build telebit-fcitx5
          cmake --build telebit-fcitx5/build -j"$(nproc)"

      - name: Run doctor CLI tests
        run: ctest --test-dir telebit-fcitx5/build --output-on-failure

      # A broken desktop entry or metainfo file does not break the build — it
      # silently removes Telebit from every software centre, which is exactly
      # the failure this metadata exists to prevent. --no-net keeps the check
      # off the network so it cannot fail because a screenshot host is down.
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate telebit-fcitx5/build/data/io.github.sonnam0904.Telebit.desktop
          appstreamcli validate --no-net \
            telebit-fcitx5/build/data/io.github.sonnam0904.Telebit.metainfo.xml \
            telebit-fcitx5/data/io.github.sonnam0904.Telebit.Addon.metainfo.xml

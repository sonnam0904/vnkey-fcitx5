name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# The publish-apt steps below push to gh-pages, which the Docs workflow also
# writes (the docs site is overlaid on top of the APT repo). Share one
# concurrency group so a docs deploy and an APT publish can never interleave and
# lose each other's commit.
concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  # Reuses the CI workflow rather than repeating the build+test steps here.
  # Everything below gates on it, so a failing conversion test blocks both the
  # packages and the published release.
  test:
    uses: ./.github/workflows/ci.yml

  # One .deb per suite so each links against that release's own libstdc++/libc:
  # jammy = Ubuntu 22.04, noble = 24.04, resolute = 26.04,
  # bookworm = Debian 12, trixie = Debian 13.
  #
  # jammy/noble build natively on their matching runner. Everything else builds
  # inside a container on a stable runner instead: there is no hosted Debian
  # runner, and the hosted `ubuntu-26.04` image is still preview-only, so
  # depending on either would make releases hostage to a runner that can change
  # or be unavailable. `image: ""` means "build native".
  package-deb:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, suffix: jammy,    image: "" }
          - { runner: ubuntu-24.04, suffix: noble,    image: "" }
          - { runner: ubuntu-24.04, suffix: resolute, image: "ubuntu:26.04" }
          - { runner: ubuntu-24.04, suffix: bookworm, image: "debian:12" }
          - { runner: ubuntu-24.04, suffix: trixie,   image: "debian:13" }

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        if: matrix.image == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libfcitx5core-dev libcurl4-openssl-dev libgtk-4-dev

      - name: Build .deb (native)
        if: matrix.image == ''
        env:
          TELEBIT_DEB_PACKAGE_SUFFIX: ${{ matrix.suffix }}
        run: bash scripts/build-deb.sh

      # safe.directory is required because /src is bind-mounted from the runner
      # and owned by a different uid than root inside the container — without it
      # the `git describe` that build-deb.sh uses for versioning aborts.
      - name: Build .deb in ${{ matrix.image }}
        if: matrix.image != ''
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            -e "TELEBIT_DEB_PACKAGE_SUFFIX=${{ matrix.suffix }}" \
            "${{ matrix.image }}" \
            bash -lc '
              set -euo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                git ca-certificates build-essential cmake pkg-config libfcitx5core-dev libcurl4-openssl-dev libgtk-4-dev
              git config --global --add safe.directory /src
              bash scripts/build-deb.sh
            '
          sudo chown -R "$(id -u):$(id -g)" telebit-fcitx5/build-deb

      - uses: actions/upload-artifact@v4
        with:
          name: telebit-fcitx5-deb-${{ matrix.suffix }}
          path: telebit-fcitx5/build-deb/*.deb

  # One .rpm per Fedora release, each built in its matching container so it
  # links against that release's own libstdc++/fcitx5.
  package-rpm:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suffix: fedora43, image: "fedora:43" }
          - { suffix: fedora44, image: "fedora:44" }

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build RPM via Docker (${{ matrix.image }})
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            -e TELEBIT_RPM_PACKAGE_SUFFIX=${{ matrix.suffix }} \
            ${{ matrix.image }} bash -c '
            dnf install -y cmake gcc-c++ make fcitx5-devel extra-cmake-modules git rpm-build libcurl-devel gtk4-devel pkgconf-pkg-config
            git config --global --add safe.directory /workspace
            bash scripts/build-rpm.sh
          '
          sudo chown -R $(id -u):$(id -g) telebit-fcitx5/build-rpm

      - uses: actions/upload-artifact@v4
        with:
          name: telebit-fcitx5-rpm-${{ matrix.suffix }}
          path: telebit-fcitx5/build-rpm/*.rpm

  release:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # appstream + librsvg2-bin are for scripts/dep11-generate.py, which
      # apt-repo-publish.sh runs: appstreamcli converts the catalog to DEP-11
      # YAML and rsvg-convert rasterizes the app icon into the icon tarballs.
      # Without them the publish step fails loudly, which is the point — a
      # repo published without dep11 data is a repo no software centre shows.
      - name: Install build dependencies (jammy .deb + host tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libfcitx5core-dev libcurl4-openssl-dev libgtk-4-dev appstream librsvg2-bin

      # No `version:` here on purpose — action-setup reads the pnpm version from
      # the "packageManager" field in package.json, so local and CI can't drift.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release's exec plugin writes release-debs/.released-version
      # from its publishCmd hook, which only fires when a release actually
      # happens. Everything below is gated on that file existing.
      #
      # NOTE: this intentionally runs as extra steps in *this* job instead of
      # a job triggered by the "release: published" event — GitHub Actions
      # does not fire new workflow runs for events created by the default
      # GITHUB_TOKEN (anti-recursion protection), so that event never arrives.
      - name: Check whether a new release was published
        id: check
        run: |
          if [[ -f release-debs/.released-version ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$(cat release-debs/.released-version)" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the telebit metapackage (one per codename suffix)
        if: steps.check.outputs.released == 'true'
        run: |
          set -euo pipefail
          for f in release-debs/telebit-fcitx5_*_amd64.deb; do
            ver="$(dpkg-deb -f "$f" Version)"
            bash scripts/build-meta-deb.sh "$ver" release-debs
          done

      - name: Import APT signing key
        if: steps.check.outputs.released == 'true'
        id: gpg
        run: |
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import
          keyid="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')"
          echo "keyid=${keyid}" >> "$GITHUB_OUTPUT"

      - name: Checkout gh-pages (the published APT repo)
        if: steps.check.outputs.released == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-repo

      - name: Publish all APT suites
        if: steps.check.outputs.released == 'true'
        run: |
          set -euo pipefail
          for suite in jammy noble resolute bookworm trixie; do
            shopt -s nullglob
            debs=(release-debs/*"+${suite}"*.deb)
            shopt -u nullglob
            if [[ ${#debs[@]} -eq 0 ]]; then
              echo "No .deb for suite '${suite}', skipping" >&2
              continue
            fi
            bash scripts/apt-repo-publish.sh "${{ github.workspace }}/apt-repo" \
              "${{ steps.gpg.outputs.keyid }}" "${suite}" "${debs[@]}"
          done

      - name: Commit and push the APT repo
        if: steps.check.outputs.released == 'true'
        working-directory: apt-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repo changes"
          else
            git commit -m "chore(apt): publish ${{ steps.check.outputs.version }}"
            git push origin gh-pages
          fi

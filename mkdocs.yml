site_name: Telebit
site_description: Bộ gõ Telex/VNI tiếng Việt cho fcitx5 trên Linux
site_url: https://sonnam0904.github.io/telebit/
site_author: sonnam0904

repo_url: https://github.com/sonnam0904/telebit
repo_name: sonnam0904/telebit
edit_uri: edit/main/docs/

copyright: Telebit — Vietnamese Telex/VNI input method for fcitx5

theme:
  name: material
  language: vi
  # Only overrides/partials/path.html — see the comment in that file for why.
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang chế độ sáng
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    # Breadcrumbs above the page title, rooted at "Home".
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: home.md
  - Bắt đầu:
      - getting-started/index.md
      - Cài đặt: getting-started/installation.md
      - Cài bằng AI agent: getting-started/install-with-ai-agent.md
      - Dùng lần đầu: getting-started/first-use.md
  - Hướng dẫn:
      - Chế độ gõ: guide/typing-modes.md
      - Tuỳ chọn cấu hình: guide/configuration.md
      - Cách gõ Telex & VNI: guide/telex-vni.md
      - Gõ tắt (macro): guide/macros.md
      - Trợ lý AI: ai-assistant.md
  - Khái niệm:
      - Âm tiết tiếng Việt: concepts/vietnamese-syllable.md
      - Kiểm tra chính tả & escape: concepts/spell-check.md
  - Tham khảo:
      - Xử lý sự cố: reference/troubleshooting.md
      - Lệnh telebit doctor: reference/doctor.md
      - Gỡ cài đặt: reference/uninstall.md
      - Chuyển từ vnkey: reference/migrate-from-vnkey.md
  - Phát triển:
      - Build & test: dev/build-and-test.md
      - Kiểm tra bằng từ điển: dev/dictionary-check.md
      - Kiến trúc: dev/architecture.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sonnam0904/telebit
      name: Telebit trên GitHub
